[package]
name = "ndisc"
version = "0.3.1"
description = "Music discography library — physical & digital releases, with Nostr sharing"
authors = ["xjmzx"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ndisc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bundled SQLite — vendors libsqlite3 with the build, so no system dep needed.
rusqlite = { version = "0.32", features = ["bundled"] }
# Master-release-key: NFKD + combining-mark strip for the content-hash
# normalisation, and SHA-256 for its wire form. See src/master_key.rs +
# schema/master-release-key-design-2026-07-19.md. (Both were already transitive.)
unicode-normalization = "0.1"
sha2 = "0.10"
# Local-library import: walk dirs and read audio tags.
trash = "5"
walkdir = "2"
lofty = "0.22"
# Discogs CSV collection import.
csv = "1"
# Nostr identity: keypair generation, bech32 npub/nsec encoding.
nostr = "0.43"
# Nostr relay client (websockets, connection pool, signing).
nostr-sdk = "0.43"
# tokio's `time::sleep` for polite relay throttling in publish_library.
tokio = { version = "1", features = ["time"] }
# HTTP client for downloading cover images from nostr.build / Blossom hosts.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# --- OS keychain backend, per platform --------------------------------------
# Every platform must name its backend explicitly. With none for the platform
# being built, the crate does not fail — it silently falls back to its in-memory
# `mock` store, which accepts a key, returns it for the rest of the process and
# loses it on restart, with no error at any point. A vanished signing key,
# reported as success. See SUITE.md, "Shared architecture conventions".
#
# macOS was missing here until 2026-09-22 and hit exactly that: the nsec was
# accepted, the footer said "stored in keychain", and the next command that
# needed it answered "no Nostr identity stored". Worse than losing it on
# restart — `keyring_entry()` builds a new Entry per call and the mock keeps its
# credential per-instance, so the write and the read never saw the same store.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
